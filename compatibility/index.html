      <h1>Which Macs and which macOS.</h1>
      <p class="lede">SpaceNamer runs on Apple silicon Macs with macOS Ventura or later. Every release is tested on each macOS version it supports, and new ones are tested the week they ship.</p>

      <div>
        <h2>Hardware</h2>
        <div class="cards cards-2">
          <div class="card">
            <h3>Apple silicon &mdash; supported</h3>
            <p>Every Mac with an M-series chip. SpaceNamer is built natively for Apple silicon.</p>
          </div>
          <div class="card">
            <h3>Intel Macs &mdash; not supported</h3>
            <p>There is no Intel build, and Rosetta does not help: the app ships as an Apple silicon binary only.</p>
          </div>
        </div>
      </div>

      <div>
        <h2>What it needs from macOS</h2>
        <ul class="prose">
          <li><b>No Accessibility permission.</b> Nothing to approve in System Settings &rarr; Privacy &amp; Security.</li>
          <li><b>No Screen Recording permission.</b> SpaceNamer never reads the contents of your screen.</li>
          <li><b>No System Integrity Protection changes.</b> Nothing is injected into macOS, so it is fine on a
            managed work Mac.</li>
          <li><b>No network access for day-to-day use.</b> The only request it ever makes is the license check.</li>
        </ul>
      </div>

      <div>
        <h2>How each macOS release is tested</h2>
        <p class="measure muted">When Apple ships a new version of macOS, SpaceNamer is tested on it that week and
          this page is updated with the result. Each test covers the things most likely to break:</p>
        <ul class="prose">
          <li>Detecting every desktop, on one display and on several.</li>
          <li>Naming a desktop and seeing that name in the menu bar.</li>
          <li>Switching to each desktop by clicking its name.</li>
          <li>Names surviving a restart and surviving Mission Control reordering.</li>
        </ul>
      </div>

      <div class="note">
        <p><b>If a macOS update breaks something,</b> tell us &mdash; a report on the day of a release is worth a
          great deal. Write to <a href="#" data-mailto></a> with your macOS version and what you saw. Fixes for macOS compatibility are free, like every other update.</p>
      </div>

      <div>
        <h2>Beta versions of macOS</h2>
        <p class="measure muted">SpaceNamer is tested against public betas where possible, but a beta can change
          behaviour after that test. If you run beta macOS, expect the occasional surprise and please report it.</p>
      </div>
